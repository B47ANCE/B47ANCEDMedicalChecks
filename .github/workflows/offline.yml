name: Offline validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline ${{ matrix.lua }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lua: [lua51, lua54]
    env:
      B47MC_TEST_LUA: ${{ matrix.lua }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install offline test dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate source and run offline regressions
        run: python scripts/build.py
      - name: Validate package inputs without generating an artifact
        run: python scripts/package.py
      - name: Check whitespace
        # PR HEAD is the test merge; its first parent is the base branch.
        run: git diff --check HEAD^ HEAD
